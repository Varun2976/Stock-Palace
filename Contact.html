<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }

        header {
            background-color: rgb(87, 4, 104);
            text-align: center;
        }
        header h1 {
            margin: 0;
            padding: 10px 0;
            font-size: 3rem;
            color: white;
        }
        #map {
            border: 2px solid black;
            height: 400px;
            width: 50%;
            margin-left: 20%;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>CONTACT US</h1>
    </header>

    <div id="map"></div>

    <div style="text-align:center; margin-top:20px; font-size:1.2rem;">
        <b>Location Coordinates:</b><br>
        Latitude: 19.072869138880755<br>
        Longitude: 72.90071433047287
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([19.0760, 72.8777], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const latitude = 19.072869138880755;
        const longitude = 72.90071433047287;

        // 🔹 Custom Arrow Icon (your SVG)
        const arrowIcon = L.divIcon({
    className: "",
    html: `
    <svg width="60" height="60" viewBox="0 0 200 100">
        
        <!-- Line 1 -->
        <polyline points="20,80 60,60 100,70 140,40"
            fill="none"
            stroke="purple"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        <!-- Line 2 -->
        <polyline points="20,70 60,50 100,60 140,30"
            fill="none"
            stroke="purple"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        <!-- Line 3 -->
        <polyline points="20,60 60,40 100,50 140,20"
            fill="none"
            stroke="purple"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

    </svg>
    `,
    iconSize: [60, 60],
    iconAnchor: [30, 50]
});

        // 🔹 Marker using custom icon
        L.marker([latitude, longitude], { icon: arrowIcon }).addTo(map)
            .bindPopup(`
                <b>Welcome to my current coordinates</b><br>
                Latitude: ${latitude}<br>
                Longitude: ${longitude}
            `)
            .openPopup();
    </script>
</body>
</html>
