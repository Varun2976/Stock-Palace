<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Market Trends</title>

  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }
    header {
      background: #0a2540;
      color: white;
      padding: 16px;
      text-align: center;
    }
    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    h2 {
      margin-bottom: 10px;
    }
    footer {
      text-align: center;
      padding: 10px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard</h1>
    <p>Basic stock trends and price visualization</p>
  </header>
<div class="card">
  <h2>Reliance Industries – Live Stock Chart</h2>

  <div class="tradingview-widget-container">
    <div id="tradingview_reliance"></div>

    <script src="https://s3.tradingview.com/tv.js"></script>

    <script>
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "NSE:RELIANCE",
        "interval": "D",
        "timezone": "Asia/Mumbai",
        "theme": "light",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f4f6f8",
        "enable_publishing": false,
        "hide_top_toolbar": false,
        "withdateranges": true,
        "allow_symbol_change": true,
        "container_id": "tradingview_reliance"
      });
    </script>

  </div>
</div>

  <div class="container">

    <!-- Line Chart -->
    <div class="card">
      <h2>Stock Price Trend (NVIDIA)</h2>
      <canvas id="priceChart"></canvas>
    </div>

    <!-- Bar Chart -->
    <div class="card">
      <h2>Trading Volume</h2>
      <canvas id="volumeChart"></canvas>
    </div>

  </div>


  <script>
    // Sample stock price data
    const priceCtx = document.getElementById('priceChart');
    new Chart(priceCtx, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
        datasets: [{
          label: 'Stock Price ($)',
          data: [480, 495, 510, 505, 540],
          borderWidth: 2,
          fill: false,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: false
          }
        }
      }
    });

    // Sample volume data
    const volumeCtx = document.getElementById('volumeChart');
    new Chart(volumeCtx, {
      type: 'bar',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
        datasets: [{
          label: 'Volume (in millions)',
          data: [32, 40, 36, 50, 60]
        }]
      },
      options: {
        responsive: true
      }
    });
  </script>
  <hr>

  <p>
    <a href="index.html"><button style="background-color:rgb(63, 4, 59);font-size: 30px;border-color: black;border-radius: 10px;margin-left: 30px;padding: 10px;color: white;cursor: pointer;">Back to Home</button></a>
  </p>

</body>
</html>

</body>
</html>
