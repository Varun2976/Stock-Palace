<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Market Trends</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }
    header {
      background: #0a2540;
      color: white;
      padding: 16px;
      text-align: center;
    }
    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    input {
      margin: 5px;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>Dashboard</h1>
  <p>Basic stock trends and price visualization</p>
</header>

<!-- TradingView -->
<div class="card">
  <h2>Reliance Industries – Live Stock Chart</h2>

  <div id="tradingview_reliance"></div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
    new TradingView.widget({
      "width": "100%",
      "height": 500,
      "symbol": "NSE:RELIANCE",
      "interval": "D",
      "timezone": "Asia/Mumbai",
      "theme": "light",
      "style": "1",
      "container_id": "tradingview_reliance"
    });
  </script>
</div>

<div class="container">

  <!-- Line Chart -->
  <div class="card">
    <h2>Stock Price Trend (NVIDIA)</h2>
    <canvas id="priceChart"></canvas>
  </div>

  <!-- Bar Chart -->
  <div class="card">
    <h2>Trading Volume</h2>
    <canvas id="volumeChart"></canvas>
  </div>

  <!-- Profit Calculator -->
  <div class="card">
    <h2>Profit / Loss Calculator</h2>

    <input type="number" id="buyPrice" placeholder="Buy Price">
    <input type="number" id="sellPrice" placeholder="Sell Price">

    <button onclick="calculateProfit()">Calculate</button>

    <p id="result"></p>
  </div>

  <!-- Percentage Change -->
  <div class="card">
    <h2>Percentage Change</h2>

    <input type="number" id="oldPrice" placeholder="Old Price">
    <input type="number" id="newPrice" placeholder="New Price">

    <button onclick="calculatePercentage()">Calculate %</button>

    <p id="percentResult"></p>
  </div>

  <!-- Average Price -->
  <div class="card">
    <h2>Average Price</h2>

    <input type="text" id="prices" placeholder="e.g. 100,200,300">

    <button onclick="calculateAverage()">Find Average</button>

    <p id="avgResult"></p>
  </div>

  <!-- Max Price -->
  <div class="card">
    <h2>Highest Price This Week</h2>

    <button onclick="showMax()">Show Highest</button>
  </div>

</div>

<script>
  // Line Chart
  const priceCtx = document.getElementById('priceChart');
  new Chart(priceCtx, {
    type: 'line',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
      datasets: [{
        label: 'Stock Price ($)',
        data: [480, 495, 510, 505, 540],
        borderWidth: 2,
        fill: false,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: false
        }
      }
    }
  });

  // Bar Chart
  const volumeCtx = document.getElementById('volumeChart');
  new Chart(volumeCtx, {
    type: 'bar',
    data: {
      labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
      datasets: [{
        label: 'Volume (in millions)',
        data: [32, 40, 36, 50, 60]
      }]
    },
    options: {
      responsive: true
    }
  });

  // Profit / Loss
  function calculateProfit() {
    const buy = parseFloat(document.getElementById("buyPrice").value);
    const sell = parseFloat(document.getElementById("sellPrice").value);

    if (isNaN(buy) || isNaN(sell)) {
      document.getElementById("result").innerText = "Enter valid numbers";
      return;
    }

    const profit = sell - buy;

    if (profit > 0) {
      document.getElementById("result").innerText = "Profit: " + profit;
    } else if (profit < 0) {
      document.getElementById("result").innerText = "Loss: " + profit;
    } else {
      document.getElementById("result").innerText = "No Profit No Loss";
    }
  }

  // Percentage Change
  function calculatePercentage() {
    const oldPrice = parseFloat(document.getElementById("oldPrice").value);
    const newPrice = parseFloat(document.getElementById("newPrice").value);

    if (isNaN(oldPrice) || isNaN(newPrice) || oldPrice === 0) {
      document.getElementById("percentResult").innerText = "Enter valid values";
      return;
    }

    const percent = ((newPrice - oldPrice) / oldPrice) * 100;

    document.getElementById("percentResult").innerText =
      percent.toFixed(2) + "%";
  }

  // Average Price
  function calculateAverage() {
    const input = document.getElementById("prices").value;

    if (!input) {
      document.getElementById("avgResult").innerText = "Enter values";
      return;
    }

    const arr = input.split(",").map(Number);

    const sum = arr.reduce((a, b) => a + b, 0);
    const avg = sum / arr.length;

    document.getElementById("avgResult").innerText =
      "Average: " + avg.toFixed(2);
  }

  // Max Price
  function showMax() {
    const data = [480, 495, 510, 505, 540];

    const max = Math.max(...data);

    alert("Highest price this week: " + max);
  }
</script>

<hr>

<p>
  <a href="index.html">
    <button style="background-color:rgb(63, 4, 59);font-size: 30px;border-radius: 10px;padding: 10px;color: white;">
      Back to Home
    </button>
  </a>
</p>

</body>
</html>
